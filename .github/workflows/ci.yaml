# $schema: https://json.schemastore.org/github-workflow.json
---
name: CI

on:
  push:
    branches: [main]
  pull_request:

# The steps only set up the toolchain. What CI checks lives in the quality
# and checks recipes of the justfile, so it runs the same way locally and on
# every forge.
jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The Bun version comes from the packageManager field of package.json.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check quality
        run: just quality

      - name: Run checks
        run: just checks

      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wlz
          path: dist/wlz.js
          if-no-files-found: error
