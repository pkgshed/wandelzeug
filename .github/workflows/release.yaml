# $schema: https://json.schemastore.org/github-workflow.json
---
name: Release

on:
  push:
    tags: ["v*"]

# Creating the release needs write access to the contents. The attestation
# of the bundle needs an OIDC token for Sigstore, and write access to the
# attestations and the artifact metadata of the repository.
permissions:
  contents: write
  id-token: write
  attestations: write
  artifact-metadata: write

# The steps that prepare and create the release live in scripts, which the
# release rehearsal of the CI workflow runs as well.
jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Bun version comes from the packageManager field of package.json.
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check quality
        run: just quality

      - name: Run checks
        run: just checks

      - name: Prepare the release assets
        run: just release-assets "$GITHUB_REF_NAME"

      - name: Attest the provenance of the bundle
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/release/wlz.js

      - name: Create the GitHub release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/create-github-release.sh "$GITHUB_REF_NAME"
